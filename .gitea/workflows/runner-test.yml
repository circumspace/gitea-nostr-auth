# Runner test build: vet, test and build only. No image build, no push.
name: runner-test

on:
  push:
    branches: [ci/runner-test]
  workflow_dispatch:

jobs:
  test:
    runs-on: fra6
    timeout-minutes: 30
    env:
      RUNNER_LABEL: fra6
    steps:
      - name: Runner environment
        run: |
          echo "runner=${{ matrix.runner || env.RUNNER_LABEL }} host=$(hostname)"
          nproc; free -m; df -h / "$GITHUB_WORKSPACE" 2>/dev/null || df -h /
          cat /sys/fs/cgroup/memory.max /sys/fs/cgroup/cpu.max 2>/dev/null || true
          . /etc/os-release; echo "$PRETTY_NAME"
          for t in sudo git node docker cargo rustc go java sdkmanager gradle python3 pkg-config; do printf '%-11s %s\n' "$t" "$(command -v $t || echo MISSING)"; done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: CGO_ENABLED=0 go build -o /tmp/bin/ ./...
      - name: Resource usage
        if: always()
        run: |
          echo "memory.peak: $(( $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo 0) / 1048576 )) MiB"
          grep -E '^(oom|oom_kill) ' /sys/fs/cgroup/memory.events 2>/dev/null || true
          df -h / ; du -sh "$GITHUB_WORKSPACE" 2>/dev/null || true
